name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
          rustup toolchain install stable --profile minimal
          rustup override set stable
      - name: Check desktop build
        working-directory: cardbili
        run: cargo check --locked --features desktop
      - name: Check scripts and workflow
        run: |
          shellcheck scripts/*.sh skill/cardputer-zero/scripts/*.sh
          python3 -m py_compile scripts/*.py skill/cardputer-zero/scripts/fbcap.py
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Validate Application Store metadata
        run: python3 scripts/check-release.py
      - name: Scan Git history for credentials
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            --entrypoint sh zricethezav/gitleaks:v8.30.1 \
            -c 'git rev-parse --verify HEAD >/dev/null && gitleaks git --redact --no-banner --log-opts=--all .'

  device:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm python3-pil dpkg
          rustup toolchain install stable --profile minimal --target aarch64-unknown-linux-musl
          rustup override set stable
          rustup component add rust-docs
      - name: Build device binaries
        run: bash scripts/build-device.sh
      - name: Package binaries and corresponding source
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python3 scripts/package-release.py
      - name: Validate Debian package and corresponding source
        run: |
          python3 scripts/check-release.py --deb dist/cardbili_*_arm64.deb
          python3 .agents/skills/cardputer-app-publish/scripts/prepublish_check.py \
            --deb dist/cardbili_*_arm64.deb --app-dir .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cardbili-release
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/cardbili_*_arm64.deb
            dist/cardbili-*-source.tar.gz
            dist/SHA256SUMS

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [checks, device]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cardbili-release
          path: release
      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum -c SHA256SUMS
          gh release create "$RELEASE_TAG" \
            --verify-tag --draft --title "$RELEASE_TAG" --generate-notes \
            cardbili_*_arm64.deb cardbili-*-source.tar.gz SHA256SUMS
