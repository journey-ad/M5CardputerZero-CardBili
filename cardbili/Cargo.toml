[package]
name = "cardbili"
version = "0.1.0"
edition = "2021"

[build-dependencies]
slint-build = "~1.8"

[features]
desktop = ["dep:minifb"]

[dependencies]
slint = { version = "~1.8", default-features = false, features = ["std", "renderer-software", "software-renderer-systemfonts", "compat-1-2"] }
minifb = { version = "0.27", optional = true }
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
qrcodegen = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
